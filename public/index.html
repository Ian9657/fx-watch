<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12202b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FX Watch">
  <meta name="robots" content="noindex">
  <title>FX Watch</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@600;700&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header class="plate">
      <h1>FX WATCH</h1>
      <p class="caps small">CITIC BUY PRICE</p>
    </header>

    <!-- Feed and alert health. Tapping it refreshes. -->
    <button id="refresh" class="status" hidden>
      <span class="lamp" id="lamp" aria-hidden="true"></span>
      <span id="status-text">—</span>
      <span aria-hidden="true">↻</span>
    </button>

    <p id="error" class="error" hidden></p>

    <!-- Shown until the password is entered on this device. -->
    <form id="lock" class="lock" hidden>
      <p class="caps">PRIVATE INSTRUMENT</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="brass">UNLOCK</button>
      <p id="lock-status" class="note" role="status"></p>
    </form>

    <div id="app" hidden>
      <!-- One dial; the selector below switches which currency it reads. -->
      <section class="gauge" id="gauge" aria-labelledby="pair-name">
        <h2 id="pair-name" class="caps"><span id="pair-label">GBP → CNY</span> <span class="zone" id="zone"></span></h2>
        <!-- Brass case; the face is drawn in SVG, scale and labels filled in by app.js. -->
        <div class="case">
          <svg class="face" viewBox="0 0 340 340" role="img" aria-labelledby="pair-name">
            <defs>
              <radialGradient id="g-face" cx=".32" cy=".26" r=".85">
                <stop offset="0" stop-color="#f4eedf"></stop>
                <stop offset=".6" stop-color="#e6dcc4"></stop>
                <stop offset="1" stop-color="#cfc2a3"></stop>
              </radialGradient>
              <radialGradient id="g-hub" cx=".32" cy=".28" r=".9">
                <stop offset="0" stop-color="#fbe7b4"></stop>
                <stop offset=".45" stop-color="#b98a4b"></stop>
                <stop offset="1" stop-color="#4f3616"></stop>
              </radialGradient>
              <radialGradient id="g-glass" cx=".28" cy=".2" r=".55">
                <stop offset="0" stop-color="#fff" stop-opacity=".16"></stop>
                <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
              </radialGradient>
              <radialGradient id="g-edge" cx=".5" cy=".5" r=".5">
                <stop offset=".86" stop-color="#2a1c08" stop-opacity="0"></stop>
                <stop offset="1" stop-color="#2a1c08" stop-opacity=".32"></stop>
              </radialGradient>
              <filter id="g-grain" x="0" y="0" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="3"></feTurbulence>
                <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .35 0"></feColorMatrix>
              </filter>
              <filter id="g-shadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="2.2" dy="3" stdDeviation="1.6" flood-color="#1f1404" flood-opacity=".38"></feDropShadow>
              </filter>
              <clipPath id="g-clip"><circle cx="170" cy="170" r="143"></circle></clipPath>
              <path id="path-buy"></path>
              <path id="path-hold"></path>
              <path id="path-high"></path>
            </defs>

            <circle cx="170" cy="170" r="166.5" class="knurl"></circle>
            <circle cx="170" cy="170" r="163.5" class="bevel-light"></circle>
            <circle cx="170" cy="170" r="155" class="bevel-dark"></circle>
            <circle cx="170" cy="170" r="150" class="bevel-light"></circle>
            <circle cx="170" cy="170" r="146.5" class="seat"></circle>

            <g clip-path="url(#g-clip)">
              <circle cx="170" cy="170" r="143" fill="url(#g-face)"></circle>
              <rect x="27" y="27" width="286" height="286" filter="url(#g-grain)" opacity=".22"></rect>
              <path class="band band-buy" id="band-buy"></path>
              <path class="band band-hold" id="band-hold"></path>
              <path class="band band-high" id="band-high"></path>
              <text class="band-text on-band band-buy-label"><textPath href="#path-buy" startOffset="50%" text-anchor="middle" id="label-floor">BUY</textPath></text>
              <text class="band-text band-hold-label"><textPath href="#path-hold" startOffset="50%" text-anchor="middle" id="label-hold">HOLD</textPath></text>
              <text class="band-text on-band band-high-label"><textPath href="#path-high" startOffset="50%" text-anchor="middle" id="label-ceiling">TOO HIGH</textPath></text>
              <g id="ticks" class="ticks"></g>
              <g id="scale" class="scale"></g>
              <g id="markers" class="markers"></g>
              <rect x="66" y="212" width="208" height="64" rx="1" class="window"></rect>
              <rect x="63.5" y="209.5" width="213" height="69" class="window-rim"></rect>
              <text x="170" y="300" class="serial">FX WATCH · No. 01</text>
              <g class="needle" id="needle" filter="url(#g-shadow)">
                <g class="tremble">
                  <path d="M168.6,182 L169.3,46 L170,40 L170.7,46 L171.4,182 Z"></path>
                  <circle cx="170" cy="194" r="6.5" class="counterweight"></circle>
                  <path d="M169,182 L171,182 L171,188 L169,188 Z"></path>
                </g>
              </g>
              <circle cx="170" cy="170" r="9" fill="url(#g-hub)" filter="url(#g-shadow)"></circle>
              <circle cx="170" cy="170" r="2.2" class="hub-pin"></circle>
              <circle cx="170" cy="170" r="143" fill="url(#g-edge)"></circle>
              <circle cx="170" cy="170" r="143" fill="url(#g-glass)"></circle>
            </g>
          </svg>
          <div class="flaps" id="flaps" role="img" aria-label="—"></div>
        </div>
        <div class="limits"><span id="floor">Floor —</span><span id="ceiling">Ceiling —</span></div>
        <p class="note" id="note"></p>
      </section>

      <!-- Each lamp shows its currency's zone, so the other one is visible without switching. -->
      <div class="selector">
        <button class="pick" data-pair="GBP" aria-pressed="true"><span class="lamp-dot" id="lamp-GBP"></span><span class="caps">GBP</span></button>
        <button class="knob" id="knob" aria-label="Switch currency"><span class="knob-cap"><span class="knob-mark"></span></span></button>
        <button class="pick" data-pair="USD" aria-pressed="false"><span class="lamp-dot" id="lamp-USD"></span><span class="caps">USD</span></button>
      </div>

      <button id="toggle-settings" class="brass" aria-expanded="false" aria-controls="settings">SET FLOOR &amp; CEILING</button>

      <form id="settings" class="settings" hidden>
        <p class="note">A Telegram message when a price drops below its floor or rises above its ceiling. Leave empty to turn off.</p>
        <div class="limit-grid">
          <span></span><span class="caps small">FLOOR</span><span class="caps small">CEILING</span>
          <span class="caps">GBP</span>
          <input id="floor-input-GBP" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off" aria-label="GBP floor">
          <input id="ceiling-input-GBP" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off" aria-label="GBP ceiling">
          <span class="caps">USD</span>
          <input id="floor-input-USD" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off" aria-label="USD floor">
          <input id="ceiling-input-USD" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off" aria-label="USD ceiling">
        </div>
        <button type="submit" class="brass">SAVE</button>
        <p class="note"><span id="form-status" role="status"></span> <button type="button" id="test" class="link">Send a test message</button></p>
      </form>
    </div>

    <footer class="caps small">CITIC BANK CUSTOMER BUY PRICE · FOR REFERENCE</footer>
  </main>
</body>
</html>
