<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FX Watch">
  <title>FX Watch</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>FX Watch</h1>
      <button id="refresh" class="refresh" aria-label="Refresh"><span id="updated">Loading…</span> ↻</button>
    </header>

    <p id="error" class="error" hidden></p>

    <section class="cards">
      <button class="card" data-pair="GBP" aria-pressed="true">
        <span class="pair">GBP · CITIC buy</span>
        <span class="rate" id="rate-GBP">—</span>
        <span class="change" id="change-GBP"></span>
        <span class="quoted" id="quoted-GBP"></span>
        <span class="floor" id="floor-GBP"></span>
      </button>
      <button class="card" data-pair="USD" aria-pressed="false">
        <span class="pair">USD · CITIC buy</span>
        <span class="rate" id="rate-USD">—</span>
        <span class="change" id="change-USD"></span>
        <span class="quoted" id="quoted-USD"></span>
        <span class="floor" id="floor-USD"></span>
      </button>
    </section>

    <section class="panel">
      <div class="ranges" role="group" aria-label="Chart range">
        <button data-range="1d" aria-pressed="true">1D</button>
        <button data-range="5d" aria-pressed="false">5D</button>
        <button data-range="1mo" aria-pressed="false">1M</button>
        <button data-range="3mo" aria-pressed="false">3M</button>
        <button data-range="1y" aria-pressed="false">1Y</button>
      </div>
      <div id="chart" class="chart"></div>
      <p id="chart-note" class="muted small"></p>
    </section>

    <section class="panel">
      <h2>Alerts</h2>
      <p class="muted">Telegram message when the CITIC buy price drops below your floor. Leave empty to turn off. "Test Telegram" just checks that messages reach you.</p>
      <form id="floors">
        <label>GBP floor <input id="input-GBP" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off"></label>
        <label>USD floor <input id="input-USD" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off"></label>
        <label id="password-row" hidden>Password <input id="password" type="password" autocomplete="current-password"></label>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" id="test" class="secondary">Test Telegram</button>
        </div>
        <p id="form-status" class="muted" role="status"></p>
      </form>
    </section>

    <footer class="muted">Customer buy price from China CITIC Bank's public rate table. For reference only; the price in the CITIC app when you trade is final.</footer>
  </main>
</body>
</html>
