<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12202b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- An opaque status bar: with a translucent one the page runs under it, and
       iOS blurs the top edge of the page there, which blurred the masthead. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FX Watch">
  <meta name="robots" content="noindex">
  <title>FX Watch</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-512.png?v=2">
  <link rel="apple-touch-icon" href="/icon-180.png?v=2">
  <!-- Fonts the first screen needs, fetched alongside the stylesheet. -->
  <link rel="preload" href="/fonts/cinzel-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/playfair-display-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <h1 class="press">FX WATCH</h1>
      <p class="caps small press">CITIC BUY PRICE</p>
    </header>
    <div class="etched" aria-hidden="true"></div>

    <p id="error" class="error" hidden></p>

    <!-- Shown until the password is entered on this device. -->
    <form id="lock" class="lock" aria-label="Private instrument" hidden>
      <label for="password" class="sr-only">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" class="btn press">UNLOCK</button>
      <p id="lock-status" class="note" role="status"></p>
    </form>

    <div id="app" hidden>
      <!-- Ticker tape: the quotes the 10-minute check has seen, newest first. -->
      <div class="tape" role="region" aria-label="Recent quotes">
        <div class="tape-paper"><div class="tape-run" id="tape-run"></div></div>
        <div class="tape-slot left" aria-hidden="true"></div>
        <div class="tape-slot right" aria-hidden="true"></div>
      </div>
      <!-- One dial; the selector below switches which currency it reads. -->
      <section class="gauge" id="gauge" aria-label="Exchange rate dial">
        <!-- The crown winds the watch: pressing it refreshes now. -->
        <div class="crown-wrap">
          <button class="crown" id="crown" aria-label="Refresh now">
            <svg viewBox="0 0 120 78" aria-hidden="true">
              <defs>
                <linearGradient id="g-bow" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#f5e0aa"></stop>
                  <stop offset=".35" stop-color="#b98a4b"></stop>
                  <stop offset=".7" stop-color="#5f421d"></stop>
                  <stop offset="1" stop-color="#9c7136"></stop>
                </linearGradient>
                <linearGradient id="g-cyl" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#6a4b22"></stop>
                  <stop offset=".28" stop-color="#f3dca3"></stop>
                  <stop offset=".5" stop-color="#c39352"></stop>
                  <stop offset="1" stop-color="#4f3616"></stop>
                </linearGradient>
              </defs>
              <ellipse cx="60" cy="27" rx="31" ry="23" fill="none" stroke="#1a1208" stroke-width="8" opacity=".5" transform="translate(1.5 2.5)"></ellipse>
              <ellipse cx="60" cy="27" rx="31" ry="23" fill="none" stroke="url(#g-bow)" stroke-width="7"></ellipse>
              <path d="M31.5,22 A31,23 0 0 1 60,4.5" fill="none" stroke="rgba(255,244,214,.75)" stroke-width="1.2"></path>
              <rect x="50" y="56" width="20" height="16" fill="url(#g-cyl)"></rect>
              <rect x="46" y="68" width="28" height="9" rx=".6" fill="url(#g-cyl)"></rect>
              <rect x="39" y="37" width="42" height="22" rx="1.2" fill="url(#g-cyl)"></rect>
              <clipPath id="crown-grip"><rect x="40" y="38" width="40" height="20"></rect></clipPath>
              <g clip-path="url(#crown-grip)"><g class="crown-knurl" stroke="rgba(55,36,12,.55)" stroke-width="1">
                <line x1="37" y1="39" x2="37" y2="57"></line><line x1="40" y1="39" x2="40" y2="57"></line><line x1="43" y1="39.5" x2="43" y2="56.5"></line><line x1="46" y1="39" x2="46" y2="57"></line><line x1="49" y1="39" x2="49" y2="57"></line><line x1="52" y1="39" x2="52" y2="57"></line><line x1="55" y1="39" x2="55" y2="57"></line><line x1="58" y1="39" x2="58" y2="57"></line><line x1="61" y1="39" x2="61" y2="57"></line><line x1="64" y1="39" x2="64" y2="57"></line><line x1="67" y1="39" x2="67" y2="57"></line><line x1="70" y1="39" x2="70" y2="57"></line><line x1="73" y1="39" x2="73" y2="57"></line><line x1="76" y1="39" x2="76" y2="57"></line><line x1="79" y1="39.5" x2="79" y2="56.5"></line><line x1="82" y1="39" x2="82" y2="57"></line>
              </g></g>
              <rect x="39" y="37" width="42" height="22" rx="1.2" fill="none" stroke="rgba(255,240,200,.35)" stroke-width=".8"></rect>
              <line x1="39" y1="59" x2="81" y2="59" stroke="#2a1c0a" stroke-width="1"></line>
            </svg>
          </button>
          <span class="crown-hint press" id="crown-hint" hidden>◂ PRESS TO WIND</span>
        </div>
        <!-- Brass case; the face is drawn in SVG, scale and labels filled in by js/dial.js. -->
        <!-- Tap the case to turn the watch over; the back is a circular chart recorder. -->
        <div class="case" id="case" role="button" tabindex="0" aria-label="Turn the watch over to see the price chart">
          <svg class="face" viewBox="0 0 340 340" aria-hidden="true">
            <defs>
              <radialGradient id="g-face" cx=".32" cy=".26" r=".85">
                <stop offset="0" stop-color="#f4eedf"></stop>
                <stop offset=".6" stop-color="#e6dcc4"></stop>
                <stop offset="1" stop-color="#cfc2a3"></stop>
              </radialGradient>
              <radialGradient id="g-hub" cx=".32" cy=".28" r=".9">
                <stop offset="0" stop-color="#fbe7b4"></stop>
                <stop offset=".45" stop-color="#b98a4b"></stop>
                <stop offset="1" stop-color="#4f3616"></stop>
              </radialGradient>
              <radialGradient id="g-glass" cx=".28" cy=".2" r=".55">
                <stop offset="0" stop-color="#fff" stop-opacity=".16"></stop>
                <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
              </radialGradient>
              <linearGradient id="g-glint" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0"></stop>
                <stop offset=".5" stop-color="#fff" stop-opacity=".32"></stop>
                <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
              </linearGradient>
              <radialGradient id="g-edge" cx=".5" cy=".5" r=".5">
                <stop offset=".86" stop-color="#2a1c08" stop-opacity="0"></stop>
                <stop offset="1" stop-color="#2a1c08" stop-opacity=".32"></stop>
              </radialGradient>
              <filter id="g-grain" x="0" y="0" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="3"></feTurbulence>
                <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .35 0"></feColorMatrix>
              </filter>
              <filter id="g-shadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="2.2" dy="3" stdDeviation="1.6" flood-color="#1f1404" flood-opacity=".38"></feDropShadow>
              </filter>
              <clipPath id="g-clip"><circle cx="170" cy="170" r="143"></circle></clipPath>
              <path id="path-buy"></path>
              <path id="path-hold"></path>
              <path id="path-high"></path>
            </defs>

            <circle cx="170" cy="170" r="166.5" class="knurl"></circle>
            <circle cx="170" cy="170" r="163.5" class="bevel-light"></circle>
            <circle cx="170" cy="170" r="155" class="bevel-dark"></circle>
            <circle cx="170" cy="170" r="150" class="bevel-light"></circle>
            <circle cx="170" cy="170" r="146.5" class="seat"></circle>

            <g clip-path="url(#g-clip)">
              <circle cx="170" cy="170" r="143" fill="url(#g-face)"></circle>
              <rect x="27" y="27" width="286" height="286" filter="url(#g-grain)" opacity=".22"></rect>
              <path class="band band-buy" id="band-buy"></path>
              <path class="band band-hold" id="band-hold"></path>
              <path class="band band-high" id="band-high"></path>
              <text class="band-text on-band band-buy-label"><textPath href="#path-buy" startOffset="50%" text-anchor="middle" id="label-floor">BUY</textPath></text>
              <text class="band-text band-hold-label"><textPath href="#path-hold" startOffset="50%" text-anchor="middle" id="label-hold">HOLD</textPath></text>
              <text class="band-text on-band band-high-label"><textPath href="#path-high" startOffset="50%" text-anchor="middle" id="label-ceiling">TOO HIGH</textPath></text>
              <g id="ticks" class="ticks"></g>
              <g id="scale" class="scale"></g>
              <g id="markers" class="markers"></g>
              <rect x="66" y="212" width="208" height="64" rx="1" class="window"></rect>
              <rect x="63.5" y="209.5" width="213" height="69" class="window-rim"></rect>
              <text x="170" y="298" class="pair-engrave" id="pair-label">CNY PER GBP</text>
              <g class="needle" id="needle" filter="url(#g-shadow)">
                <g class="tremble">
                  <path d="M168.6,182 L169.3,46 L170,40 L170.7,46 L171.4,182 Z"></path>
                  <circle cx="170" cy="194" r="6.5" class="counterweight"></circle>
                  <path d="M169,182 L171,182 L171,188 L169,188 Z"></path>
                </g>
              </g>
              <circle cx="170" cy="170" r="9" fill="url(#g-hub)" filter="url(#g-shadow)"></circle>
              <circle cx="170" cy="170" r="2.2" class="hub-pin"></circle>
              <circle cx="170" cy="170" r="143" fill="url(#g-edge)"></circle>
              <circle cx="170" cy="170" r="143" fill="url(#g-glass)"></circle>
              <rect class="glint" x="-90" y="-20" width="70" height="380" fill="url(#g-glint)"></rect>
            </g>
          </svg>
          <div class="flaps" id="flaps" role="img" aria-label="—"></div>
          <!-- The back: a round chart turning once per span, pen at the top. The
               bezel turns one way in clicks, showing the span through a
               window at twelve. -->
          <svg class="back" id="back" viewBox="0 0 340 340" aria-hidden="true">
            <defs>
              <clipPath id="b-clip"><circle cx="170" cy="170" r="143"></circle></clipPath>
              <radialGradient id="b-glass" cx=".28" cy=".2" r=".55">
                <stop offset="0" stop-color="#fff" stop-opacity=".2"></stop>
                <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
              </radialGradient>
            </defs>
            <circle cx="170" cy="170" r="166.5" class="knurl"></circle>
            <circle cx="170" cy="170" r="163.5" class="bevel-light"></circle>
            <circle cx="170" cy="170" r="155" class="bevel-dark"></circle>
            <circle cx="170" cy="170" r="150" class="bevel-light"></circle>
            <circle cx="170" cy="170" r="146.5" class="seat"></circle>
            <g clip-path="url(#b-clip)">
              <circle cx="170" cy="170" r="143" fill="url(#g-face)"></circle>
              <rect x="27" y="27" width="286" height="286" filter="url(#g-grain)" opacity=".18"></rect>
              <g id="polar"></g>
              <circle cx="170" cy="170" r="143" fill="url(#g-edge)"></circle>
              <circle cx="170" cy="170" r="143" fill="url(#b-glass)"></circle>
              <rect class="glint" x="-90" y="-20" width="70" height="380" fill="url(#g-glint)"></rect>
            </g>
            <g class="bezel" id="bezel"></g>
          </svg>
          <div class="lid" id="lid" hidden></div>
        </div>
        <span class="turn-hint press" id="turn-hint" hidden>TAP THE WATCH TO TURN IT OVER</span>
        <span class="sr-only" id="back-live" aria-live="polite"></span>
      </section>

      <!-- A lamp for each currency on the knob shows its zone, so the others are visible without switching. -->
      <div class="selector">
        <span class="picks" id="picks-left"></span>
        <button class="knob" id="knob" aria-label="Switch currency"><span class="knob-cap"><span class="knob-mark"></span></span></button>
        <span class="picks" id="picks-right"></span>
      </div>

      <div class="readout">
        <p class="zone-line press"><span class="zone" id="zone"></span></p>
        <p class="limits press"><span id="floor">Floor —</span> · <span id="ceiling">Ceiling —</span></p>
        <p class="note press" id="note"></p>
        <!-- Feed and alert health. Tapping it refreshes too. -->
        <button id="refresh" class="status press" hidden>
          <span class="lamp" id="lamp" aria-hidden="true"></span>
          <span id="status-text">—</span>
        </button>
      </div>

      <button id="toggle-settings" class="btn press" aria-haspopup="dialog" aria-controls="settings">Set floor &amp; ceiling</button>
    </div>

    <!-- Settings slide up from the bottom: one row of number wheels per limit. -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <form id="settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <span class="sheet-grip" aria-hidden="true"></span>
      <div class="sheet-head">
        <h2 id="sheet-title" class="press"><span class="code-wheel" id="sheet-pair" tabindex="0" role="spinbutton" aria-label="Currency"></span> LIMITS</h2>
        <span class="sheet-hint press" id="sheet-now"></span>
        <button type="button" class="toggle toggle-knob press" id="toggle-knob" aria-pressed="true" aria-label="On the knob">KNOB ON</button>
        <button type="button" class="sheet-x" id="sheet-close" aria-label="Close"></button>
      </div>
      <div class="wheel-row" id="row-floor">
        <span class="row-label">
          <span class="caps press">FLOOR</span>
          <button type="button" class="to-now press" id="now-floor" aria-label="Set the floor to the current price">SET TO NOW</button>
        </span>
        <div class="wheels" id="wheels-floor"></div>
        <button type="button" class="toggle press" id="toggle-floor" aria-pressed="true" aria-label="Floor alert">ON</button>
      </div>
      <div class="wheel-row" id="row-ceiling">
        <span class="row-label">
          <span class="caps press">CEILING</span>
          <button type="button" class="to-now press" id="now-ceiling" aria-label="Set the ceiling to the current price">SET TO NOW</button>
        </span>
        <div class="wheels" id="wheels-ceiling"></div>
        <button type="button" class="toggle press" id="toggle-ceiling" aria-pressed="true" aria-label="Ceiling alert">ON</button>
      </div>
      <p class="note press" id="sheet-note">A Telegram message when the price drops below the floor or rises above the ceiling.</p>
      <button type="submit" class="btn btn-strong press">Save</button>
      <div class="sheet-foot">
        <span class="note press" id="form-status" role="status"></span>
        <span class="sheet-actions">
          <button type="button" id="export" class="btn-small press">Download CSV</button>
          <button type="button" id="test" class="btn-small press">Send test message</button>
        </span>
      </div>
    </form>

    <footer class="caps small press">CITIC PRICE TO BUY WITH CNY · FOR REFERENCE</footer>
  </main>
</body>
</html>
