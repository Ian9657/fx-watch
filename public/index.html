<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FX Watch">
  <title>FX Watch</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>FX Watch</h1>
      <button id="refresh" class="refresh" aria-label="Refresh"><span id="updated">Loading…</span> ↻</button>
    </header>

    <p id="error" class="error" hidden></p>

    <section class="cards">
      <article class="card" data-pair="GBP">
        <span class="pair">GBP · CITIC buy</span>
        <span class="rate" id="rate-GBP">—</span>
        <span class="change" id="change-GBP"></span>
        <span class="quoted" id="quoted-GBP"></span>
        <span class="limits" id="limits-GBP"></span>
        <span class="state" id="state-GBP"></span>
      </article>
      <article class="card" data-pair="USD">
        <span class="pair">USD · CITIC buy</span>
        <span class="rate" id="rate-USD">—</span>
        <span class="change" id="change-USD"></span>
        <span class="quoted" id="quoted-USD"></span>
        <span class="limits" id="limits-USD"></span>
        <span class="state" id="state-USD"></span>
      </article>
    </section>

    <section class="panel">
      <h2>Alerts</h2>
      <p class="muted">Telegram message when a price drops below its floor or rises above its ceiling. Leave empty to turn off.</p>
      <form id="limits">
        <div class="limit-grid">
          <span></span><span class="col">Floor</span><span class="col">Ceiling</span>
          <span>GBP</span>
          <input id="floor-GBP" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off" aria-label="GBP floor">
          <input id="ceiling-GBP" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off" aria-label="GBP ceiling">
          <span>USD</span>
          <input id="floor-USD" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off" aria-label="USD floor">
          <input id="ceiling-USD" type="number" inputmode="decimal" step="0.0001" min="0.0001" placeholder="Off" aria-label="USD ceiling">
        </div>
        <label id="password-row" hidden>Password <input id="password" type="password" autocomplete="current-password"></label>
        <button type="submit" class="save">Save</button>
        <p class="muted small"><span id="form-status" role="status"></span> <button type="button" id="test" class="link">Send a test message</button></p>
      </form>
    </section>

    <footer class="muted">CITIC Bank customer buy price, for reference. The price in the CITIC app is final.</footer>
  </main>
</body>
</html>
